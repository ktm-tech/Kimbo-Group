<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kimbo Group favicon">
  <title>KG favicon</title>
  <!-- Rounded brand chip: avoids white-box look, stays legible at 16px on light and dark tabs -->
  <rect x="1" y="1" width="62" height="62" rx="14" fill="#00D72B"/>
  <g font-family="'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="32" y="44" font-size="30" letter-spacing="-2" fill="#0B0B0B">KG</text>
  </g>
</svg>
